<title>Elite School Complex – Staff Attendance</title>
<style>
:root{
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Avenir Next","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
--tx:var(--ink);
--ink:#12263A; --ink2:#1D3A57; --paper:#EDF0F3; --card:#FFFFFF; --line:#D5DBE2; --text:#14212F; --muted:#586878;
--gold:#B8801A; --goldtext:#F0CF86; --goldbg:#F7EAC9;
--ok:#17794F; --okbg:#DCF1E6; --bad:#B53030; --badbg:#F8DCDC; --idle:#5F6C79; --idlebg:#E3E7EB; --leave:#2C5CA6; --leavebg:#DCE7F5;
--field:#FFFFFF; --shadow:0 1px 2px rgba(18,38,58,.08),0 6px 20px rgba(18,38,58,.06);
--abs:#33414F; --absbg:#D3D9DF;
--u0:#C77D00; --u1:#0C8478; --u2:#3560C4; --u3:#8248B8;
}
@media (prefers-color-scheme:dark){
:root{
--ink:#0A1522; --ink2:#14293F; --paper:#0E1925; --card:#152432; --line:#2A3B4D; --text:#E5ECF2; --muted:#9AAABA;
--gold:#E2AB3E; --goldbg:#3A2F14;
--ok:#52C890; --okbg:#12382A; --bad:#F27D7D; --badbg:#401A1C; --idle:#A3AFBB; --idlebg:#223040; --leave:#86AEEB; --leavebg:#192B45;
--field:#0F1B28; --shadow:none;
--abs:#D0D8E0; --absbg:#34424F;
--tx:var(--text);
--u0:#F0B340; --u1:#43CDBD; --u2:#7FA4F2; --u3:#BE8CEB;
}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
small{color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* ---------- buttons & fields ---------- */
.btn{min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;border-radius:9px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghostw{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 12px}
label.f>span{display:block;margin-bottom:4px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
.row>.btn{flex:0 0 auto}

/* ---------- kiosk ---------- */
.kiosk{display:grid;grid-template-columns:minmax(320px,36%) 1fr;min-height:100vh;min-height:100dvh}
.clockpanel{background:var(--ink);color:#F2F5F8;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:14px}
.clockpanel .school{font-size:15px;opacity:.78}
.clockpanel .date{font-size:clamp(17px,2vw,22px);margin-top:clamp(0px,2vh,20px)}
.clockpanel{container-type:inline-size}
.clockpanel .time{font-size:clamp(38px,4.8vw,70px);font-size:min(17cqw,96px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.025em;white-space:nowrap}
.clockpanel .time .ap{font-size:.34em;font-weight:600;letter-spacing:.04em;margin-left:.35em;color:var(--goldtext)}
.clockpanel .greet{font-size:18px;max-width:30ch;color:var(--goldtext)}
.window{margin-top:auto;background:rgba(255,255,255,.08);border-radius:14px;padding:16px}
.window b{display:block;font-size:17px}
.window span{font-size:14px;opacity:.85}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:#52C890;border-radius:99px}
.window.soon .bar i{background:#F0B84A}
.window.closed .bar i{background:#F08A8A}
.stage{padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;gap:20px;max-width:920px;width:100%;margin:0 auto}
.stage h2{font-size:clamp(24px,3vw,34px)}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.steps span{padding:4px 12px;border-radius:99px;background:var(--idlebg)}
.steps span.on{background:var(--ink);color:#fff}
.units{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(150px,1fr);gap:16px;flex:1 1 auto;max-height:560px}
.unit{min-height:150px;justify-content:center;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.unit b{font-size:30px}
.unit span{color:var(--muted)}
.unit:hover,.unit:focus-visible{border-color:var(--gold)}
.unit:active{transform:scale(.985)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.nm{min-height:66px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:18px}
.nm small{display:block;font-weight:400;font-size:13px}
.nm.done{background:var(--okbg);border-color:transparent;color:var(--ok)}
.nm.done small{color:inherit;opacity:.8}
.nm:hover{border-color:var(--gold)}
.sigbox{position:relative;border-radius:16px;border:2px solid var(--line);background:#fff;height:min(260px,36vh);min-height:180px;overflow:hidden}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#fff}
.sigbox .hint{position:absolute;left:24px;right:24px;bottom:44px;border-top:2px dashed #B9C3CD;pointer-events:none}
.sigbox .hint em{position:absolute;top:6px;left:0;font-style:normal;color:#7A8896;font-size:14px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.actions .btn.primary{flex:2 1 220px}
.result{text-align:center;padding:clamp(16px,4vw,40px);border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
.result .ico{width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.result .ico.ok{background:var(--okbg);color:var(--ok)}
.result .ico.warn{background:var(--goldbg);color:var(--gold)}
.result h2{font-size:clamp(26px,3.4vw,38px)}
.result .who{font-size:22px;font-weight:700}
.pill.bigpill{font-size:20px;padding:8px 24px}
.ret{width:min(320px,80%);height:6px;border-radius:99px;background:var(--idlebg);overflow:hidden;margin-top:8px}
.ret i{display:block;height:100%;background:var(--ink);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.adminlink{margin-top:auto;align-self:flex-end;background:none;border:0;color:var(--muted);padding:10px 4px;font-size:14px;text-decoration:underline}
.warn,.note{padding:10px 14px;border-radius:12px;background:var(--goldbg);color:var(--text);font-size:14px;border:1px solid var(--gold)}
.note.info{background:var(--leavebg);border-color:var(--leave)}
@media (max-width:860px){
.kiosk{grid-template-columns:1fr}
.clockpanel{gap:8px}.clockpanel .date{margin-top:0}
.window{margin-top:6px}
.units{grid-template-columns:1fr 1fr}
.unit{min-height:120px}.unit b{font-size:24px}
}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.idle{background:var(--idlebg);color:var(--idle)}
.pill.abs{background:var(--absbg);color:var(--abs)}
.pill.leave{background:var(--leavebg);color:var(--leave)}

/* ---------- admin ---------- */
.ahead{background:var(--ink);color:#fff;padding:14px clamp(14px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ahead .school{font-size:13px;opacity:.75}
.ahead h1{font-size:20px}
.ahr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.aclock{font-variant-numeric:tabular-nums;font-size:14px;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 clamp(10px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.acontent{padding:clamp(14px,3vw,32px);max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.4vw,24px);box-shadow:var(--shadow)}
.panel h2{font-size:20px;margin-bottom:12px}
.panel h3{font-size:16px;margin:18px 0 8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td,.tbl tr.sel td{background:var(--idlebg)}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--line)}
.tbl tr.rate td{font-weight:800;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cap{font-size:13px;color:var(--muted);margin:8px 0 0}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.62);display:grid;place-items:center;padding:14px;z-index:50;overflow:auto}
.sheet{background:var(--card);border-radius:18px;padding:clamp(16px,3vw,26px);width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sheet h2{font-size:21px;margin-bottom:12px}
.sheet .actions{margin-top:14px}
.sigimg{background:#fff;border:2px solid var(--line);border-radius:12px;width:100%;max-height:200px;object-fit:contain}
.ferr{color:var(--bad);font-weight:600;min-height:20px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px;margin-bottom:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.pinsheet{text-align:center;width:min(360px,100%)}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--text);border-color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pad button{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--field);font-size:24px;font-weight:600}
.pad button.x{border-color:transparent;background:none;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:80;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.35);font-weight:600}
.toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
/* ---------- unit colours, avatars, progress ---------- */
.uc-Preschool{--uc:var(--u0)}.uc-Primary{--uc:var(--u1)}.uc-JHS{--uc:var(--u2)}.uc-MSS{--uc:var(--u3)}
.avatar{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--uc);background:color-mix(in srgb,var(--uc) 16%,var(--card));border:2px solid color-mix(in srgb,var(--uc) 40%,transparent)}
.avatar.sm{width:36px;height:36px;font-size:14px}
.unit{position:relative;overflow:hidden;gap:14px}
.unit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--uc)}
.unit .ut{display:flex;align-items:center;gap:14px}
.unit .ut .avatar{width:56px;height:56px;font-size:17px;color:var(--uc)}
.unit .ut b{color:var(--text)}
.unit b{font-size:30px;line-height:1.1}
.unit .meter{height:8px;border-radius:99px;background:var(--idlebg);overflow:hidden}
.unit .meter i{display:block;height:100%;background:var(--uc);border-radius:99px;transition:width .4s}
.unit .cnt{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.unit:hover,.unit:focus-visible{border-color:var(--uc)}
.nm{gap:14px}
.nm .nmt{flex:1 1 auto;min-width:0}
.nm .nmt>span{display:block;overflow:hidden;text-overflow:ellipsis}
.nm.done .avatar{color:var(--ok);background:transparent;border-color:currentColor}
.nm:hover{border-color:var(--uc)}
.crumb{display:flex;align-items:center;gap:12px}
.crumb .avatar{width:56px;height:56px;font-size:20px}
.result .ico svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.result .ico{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- admin dashboard visuals ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .bg{stroke:var(--idlebg)}
.ring .fg{stroke:var(--ok);transition:stroke-dasharray .6s}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-size:29px;line-height:1;font-variant-numeric:tabular-nums}
.ring .mid span{font-size:13px;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border-radius:14px;padding:12px 14px;background:var(--idlebg);text-align:left}
.tile b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600}
.tile.ok{background:var(--okbg);color:var(--ok)}.tile.bad{background:var(--badbg);color:var(--bad)}.tile.idle{background:var(--absbg);color:var(--abs)}.tile.leave{background:var(--leavebg);color:var(--leave)}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--idlebg);width:100%;margin:14px 0 6px}
.seg i{display:block;height:100%}
.seg .s-ok{background:var(--ok)}.seg .s-late{background:var(--bad)}.seg .s-bad{background:#8D99A6}.seg .s-leave{background:var(--leave)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor}
.legend .l-ok{color:var(--ok)}.legend .l-late{color:var(--bad)}.legend .l-bad{color:#7C8895}.legend .l-leave{color:var(--leave)}
.ucards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ucard{text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--uc)}
.ucard.sel{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 8%,var(--card))}
.ucard .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ucard .h b{font-size:18px}.ucard .h span{font-weight:700;font-variant-numeric:tabular-nums}
.ucard .seg{margin:0;height:8px}
.ucard small{font-size:13px}
.person{display:flex;align-items:center;gap:12px}
.ahead{position:sticky;top:0;z-index:20}
@media (max-width:600px){
.hide-sm{display:none}
.tbl td,.tbl th{padding:8px 6px}
.unit .ut{flex-direction:column;align-items:flex-start;gap:8px}
.unit .ut .avatar{width:44px;height:44px;font-size:14px}
.unit b{font-size:22px}
.unit{padding:16px 16px 16px 20px}
.units{max-height:none}
}
/* ---------- school logo + glow ---------- */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 4px}
.logo{position:relative;width:clamp(120px,15vw,176px);aspect-ratio:1;border-radius:28%;isolation:isolate}
.logo::before{content:"";position:absolute;inset:-34%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(246,214,138,.62) 0%,rgba(246,214,138,.22) 42%,transparent 68%);animation:glowPulse 3.4s ease-in-out infinite}
.logo img{width:100%;height:100%;display:block;border-radius:28%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 22px rgba(246,214,138,.85),0 0 60px rgba(246,214,138,.45);animation:glowRing 3.4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes glowRing{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 16px rgba(246,214,138,.6),0 0 44px rgba(246,214,138,.3)}50%{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 30px rgba(246,214,138,1),0 0 80px rgba(246,214,138,.6)}}
.brand .sname{font-size:clamp(18px,2vw,22px);font-weight:700;letter-spacing:-.01em;margin-top:6px}
.brand .motto{font-size:13px;color:var(--goldtext);opacity:.9;margin-top:-6px}
.ahead .logo{width:46px;border-radius:24%}
.ahead .logo::before{inset:-40%}
.ahead .logo img{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 0 12px rgba(246,214,138,.7)}
.ahead .lg{display:flex;align-items:center;gap:14px}
@media (max-width:860px){.brand{flex-direction:row;text-align:left;gap:16px}.logo{width:84px}.brand .sname{margin:0}.brand .motto{margin:2px 0 0}}
/* ---------- Apple-style controls ---------- */
.btn{border:0;border-radius:14px;min-height:52px;padding:10px 22px;background:color-mix(in srgb,var(--ink) 11%,transparent);color:var(--tx);font-weight:600;letter-spacing:-.01em;transition:transform .12s ease,opacity .12s ease,background-color .35s}
.btn:active{opacity:.6;transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:4px 14px;border-radius:10px}
.btn.ghostw{background:rgba(255,255,255,.18);color:#fff}
.btn[disabled]{opacity:.35;transform:none}
.chip{border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--tx);padding:8px 16px;transition:transform .12s,opacity .12s,background-color .35s}
.chip:active{opacity:.6;transform:scale(.96)}
.chip.on{background:var(--ink);color:#fff}
.steps span{transition:background-color .35s}.steps span.on{background:var(--ink);color:#fff}
.unit,.nm{border:0;box-shadow:0 1px 2px rgba(18,38,58,.08),0 10px 28px rgba(18,38,58,.07);transition:transform .14s ease,box-shadow .14s,background-color .2s}
.unit{border-radius:26px;justify-content:center;gap:20px}
.unit::before{display:none}
.nm{border-radius:20px}
.unit:active,.nm:active{transform:scale(.97);background:color-mix(in srgb,var(--uc,var(--ink)) 12%,var(--card))}
.unit:hover,.nm:hover,.unit:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--uc,var(--ink)) 45%,transparent),0 10px 28px rgba(18,38,58,.08)}
.nm.done{background:var(--okbg);box-shadow:none}
.ucard{border:0;border-top:0;border-radius:18px;box-shadow:0 1px 2px rgba(18,38,58,.08);transition:transform .12s}
.ucard:active{transform:scale(.97)}
.ucard.sel{box-shadow:0 0 0 3px var(--uc)}
.tab{transition:color .2s}
.tab:active{opacity:.55}
.clockpanel,.ahead,.ret i{transition:background-color .45s ease}
.clockpanel{cursor:pointer;-webkit-user-select:none;user-select:none}
.clockpanel:active{filter:brightness(1.12)}
.tapHint{font-size:12px;opacity:.55;text-align:center;margin-top:-4px}
.pad{justify-items:center;gap:14px 20px;margin:18px 0}
.pad button{width:78px;height:78px;border-radius:50%;border:0;background:color-mix(in srgb,var(--text) 9%,var(--card));font-size:30px;font-weight:400;display:grid;place-items:center;transition:background-color .1s,transform .1s}
.pad button:active{background:color-mix(in srgb,var(--ink) 35%,var(--card));transform:scale(.94)}
.pad button.x{background:none;pointer-events:none}
.dots i{border-color:var(--text)}.dots i.on{background:var(--ink);border-color:var(--ink)}
.sheet .btn{width:auto}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.swatch{width:46px;height:46px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .12s}
.swatch:active{transform:scale(.9)}
.swatch[aria-pressed=true]{outline:3px solid var(--text);outline-offset:3px}
@media print{
.noprint,.tabs,.ahead,.toast{display:none!important}
body{background:#fff;color:#000}
.panel{box-shadow:none;border:0;padding:0}
.pill{border:1px solid #888;background:none!important;color:#000!important}
}
</style>

/* ---------- time helpers (clockOffset is only used by the test clock) ---------- */
let clockOffset=0;
const now=()=>new Date(Date.now()+clockOffset);
const dKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dKey(d)};
const secsOf=d=>d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
const hm=t=>{const [h,m]=t.split(':').map(Number);return h*3600+m*60};
const h12=(h,m,s)=>`${pad(h%12||12)}:${pad(m)}${s==null?'':':'+pad(s)} ${h>=12?'PM':'AM'}`;
const fmtTime=d=>h12(d.getHours(),d.getMinutes(),d.getSeconds());
const timeHTML=d=>{const t=fmtTime(d);return `${t.slice(0,8)}<span class="ap">${t.slice(9)}</span>`};
const initials=n=>n.replace(/\b(mr|mrs|ms|dr|prof)\.?\s/ig,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const fmtT=str=>{const [h,m,s]=str.split(':').map(Number);return h12(h,m,s==null?null:s)};
const lbl=t=>{const [h,m]=t.split(':').map(Number);return `${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`};
const fmtDate=d=>`${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtKey=k=>fmtDate(parseKey(k));
const fmtShort=k=>{const d=parseKey(k);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`};
const stamp=()=>{const n=now();return dKey(n)+' '+fmtTime(n)};
const greeting=d=>{const h=d.getHours();return `Good ${h<12?'morning':h<17?'afternoon':'evening'}! Please sign in for today's attendance.`};

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function openDB(){return new Promise((res,rej)=>{
if(!window.indexedDB)return rej(new Error('no idb'));
const t=setTimeout(()=>rej(new Error('timeout')),3000);
let r;try{r=indexedDB.open('sams-db',1)}catch(e){clearTimeout(t);return rej(e)}
r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('kv');db.createObjectStore('sig')};
r.onsuccess=()=>{clearTimeout(t);res(r.result)};
r.onerror=()=>{clearTimeout(t);rej(r.error)};
r.onblocked=()=>{clearTimeout(t);rej(new Error('blocked'))};
})}
const Store={
db:null,persistent:false,mem:{kv:{},sig:{}},
async init(){try{this.db=await openDB();await this.put('kv','__probe',1);this.persistent=true}catch(e){this.db=null;this.persistent=false}},
put(store,key,val){
if(!this.db){this.mem[store][key]=val;return Promise.resolve()}
return new Promise((res,rej)=>{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
},
get(store,key){if(!this.db)return Promise.resolve(this.mem[store][key]);return idbReq(this.db.transaction(store).objectStore(store).get(key))},
del(store,key){
if(!this.db){delete this.mem[store][key];return Promise.resolve()}
return new Promise((res,rej)=>{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
},
async allSigs(){
if(!this.db)return Object.assign({},this.mem.sig);
const os=this.db.transaction('sig').objectStore('sig');
const keys=await idbReq(os.getAllKeys());const vals=await idbReq(os.getAll());
const o={};keys.forEach((k,i)=>o[k]=vals[i]);return o;
},
async clearSigs(){
if(!this.db){this.mem.sig={};return}
return new Promise((res,rej)=>{const tx=this.db.transaction('sig','readwrite');tx.objectStore('sig').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
}
};

/* ---------- sound (Web Audio, no files needed) ---------- */
let AC=null;
function audio(){
try{
if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
if(AC&&AC.state==='suspended')AC.resume();
}catch(e){AC=null}
return AC;
}
function bell(ac,freq,t,dur,vol){
[[1,1],[2.01,.28],[3.02,.1]].forEach(([m,g])=>{
const o=ac.createOscillator(),gn=ac.createGain();
o.type='sine';o.frequency.value=freq*m;
gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol*g,t+.012);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
});
}
function playSound(kind){
if(S&&S.settings.sound===false)return;
const ac=audio();if(!ac)return;
const t=ac.currentTime+.02;
if(kind==='ok'){bell(ac,880,t,.9,.22);bell(ac,1318.5,t+.13,1.2,.2)} // bright two-note chime
else if(kind==='late'){bell(ac,740,t,.8,.2);bell(ac,587.3,t+.14,1.0,.18)} // softer, falling
else if(kind==='dup'){bell(ac,415.3,t,.35,.18);bell(ac,415.3,t+.18,.5,.18)} // two low taps
}

const isSchoolDay=k=>isWeekday(k)&&!holidayOf(k);
const onLeave=(id,k)=>S.leaves.find(l=>l.staffId===id&&l.from<=k&&k<=l.to);
const effStatus=r=>{const c=CI.get(r.id);return c?c.to:r.status};
const statusFor=secs=>secs<=hm(S.settings.deadline)+59?'ROT':'Late'; // on time through 7:40:59
const bySt=(a,b)=>UNITS.indexOf(a.s.unit)-UNITS.indexOf(b.s.unit)||a.s.name.localeCompare(b.s.name);

function dayRows(date,unit){
const n=now(),today=dKey(n),cut=hm(S.settings.cutoff),sch=isSchoolDay(date);
return S.staff.filter(s=>activeOn(s,date)&&(!unit||s.unit===unit)).map(s=>{
const rec=RI.get(s.id+'|'+date);const e=rec?effStatus(rec):null;
let state,pending=false;
if(rec&&e!=='Void')state=e;
else if(onLeave(s.id,date))state='Leave';
else if(!sch)state='Off';
else if(date>today)state='Future';
else{state='Absent';if(date===today&&secsOf(n)<cut)pending=true}
return {s,rec,state,pending,voided:!!rec&&e==='Void'};
}).sort(bySt);
}
function summarize(rows){
const c={total:rows.length,ROT:0,Late:0,Absent:0,Leave:0,Pending:0};
for(const r of rows){
if(r.state==='ROT')c.ROT++;else if(r.state==='Late')c.Late++;
else if(r.state==='Absent'){c.Absent++;if(r.pending)c.Pending++}
else if(r.state==='Leave')c.Leave++;
}
c.recorded=c.ROT+c.Late;c.eligible=c.recorded+c.Absent;
c.rate=c.eligible?c.recorded/c.eligible*100:null;
return c;
}
const fmtRate=r=>r==null?'—':r.toFixed(2)+'%';
const STATE_LABEL={ROT:'On time (ROT)',Late:'Late',Absent:'Absent',Leave:'On leave'};
function pill(state,pending){
const m={ROT:['ok','On time'],Late:['bad','Late'],Absent:pending?['idle','Not signed in']:['abs','Absent'],Leave:['leave','On leave'],Off:['idle','No school'],Future:['idle','—']};
const [c,t]=m[state]||['idle',state];return `<span class="pill ${c}">${t}</span>`;
}

/* ---------- reports ---------- */
function repDates(kind,anchor){
if(kind==='daily')return [anchor];
const d=parseKey(anchor);
if(kind==='weekly'){const mon=addDays(anchor,-((d.getDay()+6)%7));return [0,1,2,3,4].map(i=>addDays(mon,i))}
const y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();
return Array.from({length:n},(_,i)=>`${y}-${pad(m+1)}-${pad(i+1)}`);
}
function repLabel(kind,dates){
if(kind==='daily')return fmtKey(dates[0]);
if(kind==='weekly')return `${fmtShort(dates[0])} – ${fmtShort(dates[4])}`;
const d=parseKey(dates[0]);return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function aggregate(dates,unit){
const today=dKey(now()),map=new Map();
for(const k of dates){
if(k>today)continue;
for(const r of dayRows(k,unit)){
if(r.state==='Off'||r.state==='Future'||(r.state==='Absent'&&r.pending))continue;
let a=map.get(r.s.id);if(!a){a={s:r.s,days:0,ROT:0,Late:0,Absent:0,Leave:0};map.set(r.s.id,a)}
a.days++;a[r.state]++;
}
}
return [...map.values()].sort(bySt);
}
const aPct=a=>{const d=a.ROT+a.Late+a.Absent;return d?(a.ROT+a.Late)/d*100:null};
function detailRows(dates,unit){
const today=dKey(now()),out=[];
for(const k of dates){
if(k>today)continue;
for(const r of dayRows(k,unit)){
if(r.state==='Off'||r.state==='Future'||(r.state==='Absent'&&r.pending))continue;
out.push([k,DAYS[parseKey(k).getDay()],r.s.id,r.s.name,r.rec&&r.state!=='Absent'?r.rec.unit:r.s.unit,
r.rec&&!r.voided?fmtT(r.rec.time):'',STATE_LABEL[r.state],r.rec&&CI.has(r.rec.id)?'Yes':'No']);
}
}
return out;
}

function winState(n){

return {cls:left<=300?'soon':'',html:`<b>On time until ${label}</b><div class="bar"><i style="width:${pct}%"></i></div><span>${mm>0?mm+' min ':''}${pad(ss)} s left to sign in on time</span>`};

}

/* signature canvas */
function mountSig(){
const cv=$('#sig');if(!cv)return;
const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#12263A';ctx.fillStyle='#12263A';
let drawing=false,last=null;UI.ink=false;
const pos=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
const setInk=()=>{if(!UI.ink){UI.ink=true;const b=$('#sigGo');if(b)b.disabled=false}};
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);ctx.beginPath();ctx.arc(last.x,last.y,1.3,0,7);ctx.fill();setInk()});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{drawing=false}));
cv._clear=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();UI.ink=false;const b=$('#sigGo');if(b)b.disabled=true};
}
function sigData(){
const cv=$('#sig'),w=500,h=Math.max(1,Math.round(500*cv.height/cv.width)),o=document.createElement('canvas');
o.width=w;o.height=h;const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(cv,0,0,w,h);return o.toDataURL('image/png');
}
async function submitSign(){
if(UI.busy||!UI.ink)return;UI.busy=true;
try{
await reload();
const st=staffById(UI.staffId),n=now(),date=dKey(n);
if(!st||!activeOn(st,date)){toast('Staff record not found.','bad');goUnit();return}
const ex=RI.get(st.id+'|'+date);
if(ex){showDup(ex);return} // duplicate prevention (re-checked at save time)
const sig=sigData(),status=statusFor(secsOf(n));
const rec={id:uid('R'),staffId:st.id,date,time:`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`,unit:st.unit,status,source:'kiosk'};
await Store.put('sig',rec.id,sig);
S.records.push(rec);await save();
UI.result={name:st.name,unit:st.unit,time:fmtTime(n),status};UI.step='done';render();playSound(status==='Late'?'late':'ok');autoReturn(7000);
}catch(e){toast('Could not record attendance. Please try again.','bad')}
finally{UI.busy=false}
}

const m=$('#pinMsg');if(!m)return;
const l=lockLeft();

async function pinPress(k){

Object.assign(UI,{view:'admin',tab:'dash',date:null,unitF:'',statF:'all'});render();return;
}

}

async function openRec(sid,date){

if(rec){
html+=`<dt>Original sign-in time</dt><dd>${fmtT(rec.time)}</dd><dt>Status at sign-in</dt><dd>${rec.status==='ROT'?'On time (ROT)':'Late'}</dd>

if(canEdit)html+=`<h3>Correct this record</h3>
<label class="f"><span>New status</span><select id="crStatus"><option value="ROT">On time (ROT)</option><option value="Late">Late</option><option value="Void">Reject sign-in (counts as no attendance)</option></select></label>

}else{

async function saveCorrection(a){
const to=$('#crStatus').value,reason=$('#crReason').value.trim(),rec=S.records.find(r=>r.id===a.rid);
if(!reason)return formErr('Enter a reason for the correction.');
const from=effStatus(rec);if(from===to)return formErr('Choose a status different from the current one.');
S.corrections.push({id:uid('C'),recordId:rec.id,staffId:a.sid,date:a.date,from,to,reason,at:stamp()});
log('Corrected attendance',`${staffById(a.sid).name} · ${a.date} · ${from} → ${to} · ${reason}`);
await save();closeModal();render();toast('Correction saved.');
}
async function saveManual(a){
const t=$('#mrTime').value,reason=$('#mrReason').value.trim();
if(!t)return formErr('Enter the time of arrival.');
if(!reason)return formErr('Enter a reason.');
const s=staffById(a.sid),status=statusFor(hm(t));
const rec={id:uid('R'),staffId:s.id,date:a.date,time:t+':00',unit:s.unit,status,source:'manual'};
S.records.push(rec);
S.corrections.push({id:uid('C'),recordId:rec.id,staffId:s.id,date:a.date,from:'Absent',to:status,reason,at:stamp(),kind:'manual'});

<h3>Colour theme</h3><div class="cap" style="margin:0 0 6px">Staff can also tap the clock panel on the sign-in screen to cycle through these.</div>
<div class="swatches">${THEMES.map((t,i)=>`<button class="swatch" style="background:${t[1]}" data-act="theme-pick" data-i="${i}" aria-label="${t[0]}" aria-pressed="${(S.settings.theme||0)===i}"></button>`).join('')}</div></div>
<div class="panel"><h2>Data</h2>
<p class="muted" style="margin-top:0">${Store.persistent?'Data is stored in this browser on this device only. Back it up regularly.':'Data is NOT being saved on this device right now (preview mode).'}</p>
<div class="actions"><button class="btn" data-act="backup">Download backup</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" data-chg="restore" hidden></label>
${hasSample?'<button class="btn" data-act="rm-sample">Remove sample staff</button>':''}<button class="btn danger" data-act="clear-records">Delete all attendance records</button></div></div>`;
}
async function removeSample(){
const ids=new Set(S.staff.filter(s=>s.sample).map(s=>s.id)),rids=S.records.filter(r=>ids.has(r.staffId)).map(r=>r.id);
S.staff=S.staff.filter(s=>!ids.has(s.id));S.records=S.records.filter(r=>!ids.has(r.staffId));
S.leaves=S.leaves.filter(l=>!ids.has(l.staffId));S.corrections=S.corrections.filter(c=>!ids.has(c.staffId));
for(const id of rids)await Store.del('sig',id);
log('Removed sample staff',`${ids.size} staff removed`);await save();closeModal();render();toast('Sample staff removed.');
}
async function clearRecords(){
if($('#cfTyped').value.trim()!=='DELETE')return formErr('Type DELETE exactly to confirm.');
const n=S.records.length;S.records=[];S.corrections=[];await Store.clearSigs();
log('Deleted all attendance records',`${n} records`);await save();closeModal();render();toast('All attendance records deleted.');
}
async function backup(){
const sigs=await Store.allSigs(),n=now();
downloadBlob(`SAMS_backup_${dKey(n)}.json`,new Blob([JSON.stringify({app:'SAMS',exported:stamp(),state:S,signatures:sigs})],{type:'application/json'}));
log('Downloaded backup');await save();
}
function restoreFile(file){
if(!file)return;
const fr=new FileReader();
fr.onload=()=>{
let d;try{d=JSON.parse(fr.result)}catch(e){return toast('That file is not a valid backup.','bad')}
if(!d||d.app!=='SAMS'||!d.state||!Array.isArray(d.state.staff)||!Array.isArray(d.state.records))return toast('That file is not a SAMS backup.','bad');
confirmBox('Restore backup?',`This replaces everything on this device with the backup (${d.state.staff.length} staff, ${d.state.records.length} records, saved ${esc(d.exported||'')}).`,'Restore',async()=>{
await Store.clearSigs();
for(const [k,v] of Object.entries(d.signatures||{}))await Store.put('sig',k,v);
S=d.state;S.lock={fails:0,until:0};log('Restored backup',d.exported||'');await save();closeModal();render();toast('Backup restored.');
});
};
fr.readAsText(file);
}

/* =====================================================================
RENDER + EVENTS
===================================================================== */
function render(){
const app=$('#app');
if(!S){app.innerHTML='<div class="loading">Loading…</div>';return}
applyTheme();
app.innerHTML=UI.view==='admin'?adminHTML():kioskHTML();
if(UI.view==='kiosk'&&UI.step==='sign')mountSig();
tick();
}
const canRefresh=()=>!$('#modalRoot').firstChild&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');

const actions={
'pick-unit'(el){UI.unit=el.dataset.unit;UI.step='names';UI.q='';render()},
'pick-name'(el){
const id=el.dataset.id,rec=RI.get(id+'|'+dKey(now()));UI.staffId=id;
if(rec)return showDup(rec);
UI.step='sign';render();
},
'theme-next'(){themeNext()},
async 'theme-pick'(el){S.settings.theme=+el.dataset.i;applyTheme();await save();render()},
async 'sound-toggle'(){S.settings.sound=(S.settings.sound===false);await save();render();if(S.settings.sound!==false)playSound('ok')},
'sound-test'(){const was=S.settings.sound;S.settings.sound=true;playSound('ok');setTimeout(()=>playSound('late'),1500);setTimeout(()=>playSound('dup'),3000);S.settings.sound=was},
'to-unit'(){goUnit()},
'to-names'(){UI.step='names';UI.ink=false;render()},
'sig-clear'(){const cv=$('#sig');if(cv&&cv._clear)cv._clear()},
'sig-submit'(){submitSign()},
'open-admin'(){openPin()},
'pin-key'(el){pinPress(el.dataset.k)},
'modal-close'(){closeModal()},
async 'modal-yes'(){if(UI.typed){await clearRecords();return}const cb=UI.cb;closeModal();if(cb)await cb()},
'exit-admin'(){closeModal();Object.assign(UI,{view:'kiosk',step:'unit',unit:null,staffId:null});render()},
'tab'(el){UI.tab=el.dataset.tab;render();window.scrollTo(0,0)},
'dash-today'(){UI.date=null;render()},
'unit-filter'(el){UI.unitF=(UI.unitF===el.dataset.unit)?'':el.dataset.unit;render()},
'stat-filter'(el){UI.statF=el.dataset.k;render()},
'rec-view'(el){openRec(el.dataset.sid,el.dataset.date)},
'save-corr'(el){saveCorrection(el.dataset)},
'save-manual'(el){saveManual(el.dataset)},
'rep-export'(el){doExport(el.dataset.what)},
'rep-print'(){window.print()},
'staff-unit'(el){UI.staffUnit=el.dataset.unit;render()},
'staff-new'(){openModal(staffForm(null))},
'staff-edit'(el){openModal(staffForm(staffById(el.dataset.id)))},
'staff-save'(el){saveStaff(el.dataset.id)},
'staff-deact'(el){
const s=staffById(el.dataset.id);
openModal(`<h2>Deactivate ${esc(s.name)}?</h2><p>They will no longer appear on the sign-in screen after their last working day, and will not be counted absent after it. Their past records stay in reports.</p>
<label class="f"><span>Last working day</span><input type="date" id="leftOn" value="${dKey(now())}"></label><div class="ferr" id="formErr"></div>
<div class="actions"><button class="btn" data-act="modal-close">Cancel</button><button class="btn danger" data-act="deact-go" data-id="${s.id}">Deactivate</button></div>`);
},
async 'deact-go'(el){
const s=staffById(el.dataset.id),d=$('#leftOn').value;if(!d)return formErr('Choose the last working day.');
s.leftOn=d;log('Deactivated staff',`${s.id} ${s.name}, last working day ${d}`);await save();closeModal();render();toast('Staff deactivated.');
},
async 'staff-react'(el){const s=staffById(el.dataset.id);s.leftOn=null;log('Reactivated staff',`${s.id} ${s.name}`);await save();render();toast('Staff reactivated.')},
async 'leave-add'(){
const sid=$('#lvStaff').value,from=$('#lvFrom').value,to=$('#lvTo').value;
if(!sid)return formErr('Register staff first.');
if(!from||!to)return formErr('Choose both dates.');
if(to<from)return formErr('The end date is before the start date.');
S.leaves.push({id:uid('L'),staffId:sid,type:$('#lvType').value,from,to,note:$('#lvNote').value.trim()});
log('Added leave',`${staffById(sid).name} · ${$('#lvType').value} · ${from} to ${to}`);await save();render();toast('Leave added.');
},
async 'leave-del'(el){
const l=S.leaves.find(x=>x.id===el.dataset.id);if(!l)return;
S.leaves=S.leaves.filter(x=>x.id!==l.id);const s=staffById(l.staffId);
log('Removed leave',`${s?s.name:l.staffId} · ${l.from} to ${l.to}`);await save();render();
},
async 'set-save'(){
const school=$('#setSchool').value.trim()||'Elite School Complex',dl=$('#setDeadline').value,ct=$('#setCutoff').value;
if(!dl||!ct)return formErr('Enter both times.');
if(hm(ct)<=hm(dl))return formErr('The absent time must be later than the reporting deadline.');
log('Changed settings',`School "${school}", deadline ${dl}, absent after ${ct}`);Object.assign(S.settings,{school,deadline:dl,cutoff:ct});
await save();render();toast('Settings saved.');
},
async 'pin-change'(){
const cur=$('#pinCur').value,n1=$('#pinNew').value,n2=$('#pinNew2').value,e=$('#pinErr');
if(cur!==S.settings.pin)return e.textContent='The current PIN is not correct.';
if(!/^\d{4}$/.test(n1))return e.textContent='The new PIN must be exactly 4 digits.';
if(n1!==n2)return e.textContent='The two new PINs do not match.';
S.settings.pin=n1;log('Changed administrator PIN');await save();render();toast('PIN changed.');
},
async 'hol-add'(){
const d=$('#holDate').value,l=$('#holLabel').value.trim();if(!d||!l)return toast('Enter a date and a name.','bad');
if(holidayOf(d))return toast('That date is already listed.','bad');
S.holidays.push({date:d,label:l});log('Added holiday',`${d} ${l}`);await save();render();
},
async 'hol-del'(el){S.holidays=S.holidays.filter(h=>h.date!==el.dataset.date);log('Removed holiday',el.dataset.date);await save();render()},
'sim-set'(){
const v=$('#simTime').value;if(!v)return toast('Choose a date and time first.','bad');
clockOffset=new Date(v).getTime()-Date.now();render();toast('Test clock started.');
},
'sim-clear'(){clockOffset=0;render();toast('Back to real time.')},
'backup'(){backup()},
'rm-sample'(){confirmBox('Remove sample staff?','This deletes the sample staff and any attendance they have. Your own staff are not touched.','Remove',removeSample)},
'clear-records'(){confirmBox('Delete all attendance records?','Every sign-in, signature and correction will be permanently deleted. Staff, leave and settings are kept. Download a backup first if you may need them.','Delete everything',null,'DELETE')}
};
document.addEventListener('click',e=>{
const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
const f=actions[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',e=>{
const t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
if(k==='dash-date'){UI.date=t.value||null;render()}
else if(k==='rep-kind'){UI.rep.kind=t.value;render()}
else if(k==='rep-date'){UI.rep.date=t.value||null;render()}
else if(k==='rep-unit'){UI.rep.unit=t.value;render()}
else if(k==='rep-fmt'){UI.rep.fmt=t.value}
else if(k==='restore'){restoreFile(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{
if(e.target.dataset&&e.target.dataset.inp==='q'){UI.q=e.target.value;$('#nameList').innerHTML=namesHTML()}
});
document.addEventListener('keydown',e=>{
UI.lastAct=Date.now();
if(e.key==='Escape')closeModal();
if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('clockpanel')){e.preventDefault();themeNext()}
if($('#pinDots')&&/^[0-9]$/.test(e.key))pinPress(e.key);
else if($('#pinDots')&&e.key==='Backspace')pinPress('del');
},true);
['pointerdown','touchstart'].forEach(t=>document.addEventListener(t,()=>{UI.lastAct=Date.now();audio()},true));

/* ---------- clock tick ---------- */
let lastMin=-1;
function tick(){
if(!S)return;
const n=now(),kt=$('#kTime');
if(kt){
kt.innerHTML=timeHTML(n);$('#kDate').textContent=fmtDate(n);$('#kGreet').textContent=greeting(n);
const w=winState(n),el=$('#kWin');el.className='window '+w.cls;el.innerHTML=w.html;
}
const ac=$('#aClock');if(ac)ac.textContent=fmtDate(n)+' · '+fmtTime(n);
if($('#pinDots'))pinUpdate();
const idle=Date.now()-UI.lastAct;
if(UI.view==='admin'&&idle>10*60000){closeModal();Object.assign(UI,{view:'kiosk',step:'unit'});render();toast('Signed out of the administrator dashboard after 10 minutes of inactivity.');return}
if(UI.view==='kiosk'&&(UI.step==='names'||UI.step==='sign')&&idle>90000){goUnit();return}
const m=n.getMinutes();
if(m!==lastMin){
const first=lastMin===-1;lastMin=m;
if(!first&&canRefresh()&&((UI.view==='admin'&&UI.tab==='dash')||(UI.view==='kiosk'&&UI.step==='unit')))render();
}
}
function softRefresh(){
if(!S||!canRefresh())return;
if((UI.view==='admin'&&['dash','rep','corr'].includes(UI.tab))||(UI.view==='kiosk'&&(UI.step==='unit'||UI.step==='names')))render();
}
if(bc)bc.onmessage=async()=>{await reload();softRefresh()};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S){await reload();softRefresh()}});

/* ---------- boot ---------- */
(async function(){
await Store.init();
let st=await Store.get('kv','state');
if(!st){st=seed();try{await Store.put('kv','state',st)}catch(e){}}
S=st;
if(!S.settings.school||S.settings.school==='Your School'){S.settings.school='Elite School Complex';try{await Store.put('kv','state',S)}catch(e){}}
rebuild();render();
setInterval(tick,1000);
})();
</script>
</body>
</html>
